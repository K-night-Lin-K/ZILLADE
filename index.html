<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ZILLADE</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	
	<body>
	<!-- =====================================================
		HEADER
	===================================================== -->
	<header class="header">
		<a href="#top">
			<img class="logo" src="images/title.png" alt="ZILLADE">
		</a>
		
		<nav class="menu">
			<a href="#top">TOP</a>
			<a href="#character">CHARACTER</a>
			<a href="#story">STORY</a>
			<a href="#game">GAME</a>
			<a href="#store">STORE</a>
		</nav>
	</header>
	
	<!-- =====================================================
		TOP
	===================================================== -->
	<section id="top">
		<img class="top-image" src="images/Zillade.png" alt="ZILLADE">
	</section>
	
	<!-- =====================================================
		CHARACTER
	===================================================== -->
	<section id="character" class="section">
		<h2 class="section-title">CHARACTER</h2>
		
		<div class="character-area">
			<!-- 立ち絵 -->
			<div class="character-image-area">
				<img id="characterImage" class="character-image" src="" alt="">
			</div>

			<!-- キャラクター情報 -->
			<div class="character-info">
				<h3 id="characterName" class="character-name"></h3>
				<div id="characterNameEn" class="character-name-en"></div>
				<div id="characterDescription" class="character-description"></div>
				
				<!-- 変身前後などがある場合、 JavaScriptによってここにボタンが生成される -->
				<div id="formSwitch" class="form-switch"></div>
			</div>
		</div>
		
		<!-- キャラクター一覧 -->
		<div id="characterList" class="character-list"></div>
	</section>

	<!-- =====================================================
		STORY
	===================================================== -->
	<section id="story" class="section">
		<h2 class="section-title">STORY</h2>
		
		<!-- あらすじ -->
		<div class="story-synopsis" id="storySynopsis"></div>
		
		<!-- 各話 -->
		<div class="episode-list">
			<a class="episode" href="#" onclick="loadStory('text/act01.txt', 'ACT.01', this); return false;">ACT.01</a>
			<a class="episode" href="#" onclick="loadStory('text/act02.txt', 'ACT.02', this); return false;">ACT.02</a>
			<a class="episode" href="#" onclick="loadStory('text/act03.txt', 'ACT.03', this); return false;">ACT.03</a>
		</div>
	</section>
	
	<!-- =====================================================
		GAME
	===================================================== -->
	<section id="game" class="section">
		<h2 class="section-title">GAME</h2>
		<div class="game-list">
			<!-- Beat for Winning -->
			<div class="game-card">
				<a href="https://gamemarket.jp/game/182728" target="_blank" rel="noopener">
					<h3>
						ZILLADE -Beat for Winning-
					</h3>
					<h4>
						ジレイド ビート・フォー・ウィニング
					</h4>
					<p>
						カードで遊ぶ対戦格闘ゲーム。<br>
						<img src="images/B4W.png" alt="ZILLADE -Beat for Winning-">
					</p>
				</a>
			</div>
			
			<div class="game-card">
				<h3>
					ZILLADE NEXT GAME
				</h3>
				<p>
					準備中……
				</p>
			</div>
		</div>
	</section>
	
	<!-- =====================================================
		STORE
	===================================================== -->
	<section id="store" class="section">
		<h2 class="section-title">STORE</h2>
		<div class="store-area">
			<p>
				ZILLADE -Beat for Winning-の商品はこちら
			</p>
			<a class="store-button" href="https://knightlink.booth.pm/" target="_blank" rel="noopener">
				BOOTH
			</a>
		</div>
	</section>
	
	<!-- =====================================================
		FOOTER
	===================================================== -->
	<footer class="footer">
		ZILLADE<br>
		produced by 夜騎士Lin.K
	</footer>
	
	<script src="js/main.js"></script>
	</body>
</html>
